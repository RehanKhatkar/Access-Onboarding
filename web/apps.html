<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sandbox workplace app</title><link rel="stylesheet" href="/style.css"></head><body><div style="max-width:1050px;margin:60px auto;padding:25px"><a href="/" style="color:#4d78b9;font-size:12px">← Back to Access Onboarding</a><div class="intro" style="margin-top:35px"><div><div class="eyebrow">HARBOR WORKPLACE · SANDBOX APPLICATION</div><h1 id="title"></h1><p>These account records are persisted by the application. The operator and checker inspect the same business source.</p></div><span class="environment">READ-ONLY INSPECTOR</span></div><div class="panel" id="records"></div><div class="panel"><div class="sectiontag">APPROVED ROLE CATALOGUE</div><div id="policies"></div></div></div><script>
const system=decodeURIComponent(location.pathname.split('/').pop());document.getElementById('title').textContent=system+' accounts';const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function show(){const d=await(await fetch('/api/business')).json();const a=d.accounts.filter(a=>a.system===system);document.getElementById('records').innerHTML=a.length?a.map(a=>`<div class="casehero" style="margin-bottom:15px"><div class="personavatar">${e(a.display_name.split(' ').map(s=>s[0]).join(''))}</div><div class="casetitle"><div class="sectiontag">${e(a.employee_id)} · ${e(a.id)}</div><h2>${e(a.display_name)}</h2><p>${e(a.role)} · account v${a.version}</p><p style="margin-top:10px">Rights: ${a.rights.map(e).join(' · ')}</p><div class="accountref">Effect reference: ${e(a.reference)}</div></div><span class="badge green">Active</span></div>`).join(''):'No accounts have been provisioned yet.';document.getElementById('policies').innerHTML=d.policies.filter(p=>p.system===system).map(p=>`<div class="auditrow"><span>Policy v${p.version}</span><strong>${e(p.role)}</strong><div>${p.rights.map(e).join(' · ')}<small>${p.sensitive?'Manager approval required':'Automatic within role policy'}</small></div></div>`).join('');}show();setInterval(show,1500);
</script></body></html>
